name: Infra - Deploy

on:
  push:
    tags:
      - 'infra-v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install infra dependencies
        run: npm ci
        working-directory: webvu-infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::796136114678:role/webvu-github-actions
          aws-region: us-east-1

      - name: CDK deploy onetime infra stack
        run: npx cdk deploy WebvuOnetimeInfraStack --require-approval never
        working-directory: webvu-infra

      - name: CDK deploy infra stack
        run: npx cdk deploy WebvuInfraStack --require-approval never
        working-directory: webvu-infra

      - name: Post-deploy notes
        run: |
          echo "Traffic is served via Cloudflare Tunnel (no ALB)."
          echo "Public hostnames/routes are configured on the tunnel in the Cloudflare dashboard."
          echo "Tunnel token is read from SSM: /webvu/cloudflared-tunnel-token"
