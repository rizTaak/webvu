name: webvu

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webvu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webvu}
      POSTGRES_DB: ${POSTGRES_DB:-webvu}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webvu} -d ${POSTGRES_DB:-webvu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for S3. Same AWS SDK, path-style addressing.
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-webvu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-webvu-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the assets bucket with a public-read policy, standing in for
  # CloudFront's Origin Access Control path, then exits.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-webvu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-webvu-local-secret}
      ASSETS_BUCKET: ${ASSETS_BUCKET:-webvu-assets}
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${ASSETS_BUCKET}"
        mc anonymous set download "local/$${ASSETS_BUCKET}"

  # SMTP sink. Every verification code, notification and billing reminder
  # lands here instead of a real inbox. UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000

  # Host-based routing, so local hostnames match production exactly.
  # Default profile is plain http; COMPOSE_PROFILES=tls adds Caddy's local CA.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Empty by default; the tls profile overrides it to `tls internal`.
      CADDY_TLS_DIRECTIVE: ${CADDY_TLS_DIRECTIVE:-}
      # Where the host's dev servers live. ./scripts/dev-up.sh detects this.
      CADDY_UPSTREAM_HOST: ${CADDY_UPSTREAM_HOST:-host.docker.internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      # Lets Caddy reach the API and UI dev servers running on the host.
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
